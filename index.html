<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動遊戲與教學展示平台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }

    /* 左側側邊欄 */
    #sidebar {
      width: 280px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
    }
    .header { padding: 20px; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 1.1rem; color: #38bdf8; }
    .header p { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    /* 選單列表 */
    #game-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .day-divider {
      font-size: 0.75rem;
      font-weight: bold;
      color: #64748b;
      margin: 12px 6px 4px 6px;
      letter-spacing: 0.05em;
    }
    .menu-item {
      padding: 12px 14px;
      border-radius: 8px;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid transparent;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .menu-item:hover { background: #475569; }
    .menu-item.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      font-weight: 600;
    }

    /* 右側展示區 */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #020617;
    }
    #top-bar {
      height: 52px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #334155;
    }
    #current-title { font-size: 0.95rem; font-weight: 500; }
    .action-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
    }

    /* 遊戲嵌入區 */
    #iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="header">
      <h1>互動作品集</h1>
      <p>點選單元即時切換</p>
    </div>
    <div id="game-list">
      <!-- 每日遊戲按鈕區 -->
      <div class="day-divider">第 1 天</div>
      <button class="menu-item active" onclick="loadGame(this, './day1-1.html', '第 1 天 - 遊戲 1')">🎮 遊戲 1</button>
      <button class="menu-item" onclick="loadGame(this, './day1-2.html', '第 1 天 - 遊戲 2')">🎮 遊戲 2</button>
      <button class="menu-item" onclick="loadGame(this, './day1-3.html', '第 1 天 - 遊戲 3')">🎮 遊戲 3</button>
    </div>
  </aside>

  <main id="content">
    <div id="top-bar">
      <span id="current-title">第 1 天 - 遊戲 1</span>
      <a id="open-window-btn" class="action-btn" href="./day1-1.html" target="_blank">全螢幕開啟 ↗</a>
    </div>
    <div id="iframe-container">
      <iframe id="game-viewer" src="./day1-1.html"></iframe>
    </div>
  </main>

  <script>
    function loadGame(button, fileUrl, title) {
      document.getElementById('game-viewer').src = fileUrl;
      document.getElementById('current-title').textContent = title;
      document.getElementById('open-window-btn').href = fileUrl;

      document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }
  </script>

</body>
</html>

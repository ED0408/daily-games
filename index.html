<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互動教學整合展示平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --sidebar-bg: #f8fafc;
      --active-bg: #dbeafe;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      background: #f1f5f9;
      overflow: hidden;
      color: var(--text-dark);
    }

    /* 側邊欄 */
    #sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease;
      flex-shrink: 0;
      z-index: 20;
    }
    #sidebar.collapsed {
      margin-left: -300px;
    }
    .brand-box {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .brand-box h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e3a8a;
    }
    .brand-box p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 選單容器 */
    #menu-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 單元摺疊區塊 */
    .category-group {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .category-header {
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      user-select: none;
    }
    .category-header:hover {
      background: #f8fafc;
    }
    .category-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .category-group.open .arrow {
      transform: rotate(180deg);
    }

    .category-items {
      display: none;
      padding: 6px 8px 10px 8px;
      flex-direction: column;
      gap: 4px;
      background: #fcfcfd;
      border-top: 1px solid #f1f5f9;
    }
    .category-group.open .category-items {
      display: flex;
    }

    /* 遊戲項目按鈕 */
    .game-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .game-btn:hover {
      background: #f1f5f9;
    }
    .game-btn.active {
      background: var(--active-bg);
      color: var(--primary);
      border-color: #bfdbfe;
    }
    .tag-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #475569;
      font-weight: normal;
    }
    .game-btn.active .tag-badge {
      background: #bfdbfe;
      color: #1d4ed8;
    }

    /* 右側展示舞台 */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      min-width: 0;
    }
    #top-nav {
      height: 56px;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toggle-sidebar-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .current-game-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
    }

    .btn-action {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    #iframe-box {
      flex: 1;
      width: 100%;
      height: calc(100% - 56px);
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 側邊選單欄 -->
  <aside id="sidebar">
    <div class="brand-box">
      <h1>互動教學整合展示室</h1>
      <p>點選單元展開，即時在線遊玩</p>
    </div>

    <div id="menu-container">
      <!-- 國語科 -->
      <div class="category-group open">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">
            <span>📖</span>
            <span>國語科 互動闖關</span>
          </div>
          <span class="arrow">▼</span>
        </div>
        <div class="category-items">
          <button class="game-btn active" onclick="loadGame(this, './ch7a.html', 'ch7a')">
            <span>ch7a</span>
            <span class="tag-badge">國語</span>
          </button>
          <button class="game-btn" onclick="loadGame(this, './ch7b.html', 'ch7b')">
            <span>ch7b</span>
            <span class="tag-badge">國語</span>
          </button>
          <button class="game-btn" onclick="loadGame(this, './ch7c.html', 'ch7c')">
            <span>ch7c</span>
            <span class="tag-badge">國語</span>
          </button>
        </div>
      </div>

      <!-- 數學科 -->
      <div class="category-group open">
        <div class="category-header" onclick="toggleCategory(this)">
          <div class="category-title">
            <span>📐</span>
            <span>數學科 互動闖關</span>
          </div>
          <span class="arrow">▼</span>
        </div>
        <div class="category-items">
          <button class="game-btn" onclick="loadGame(this, './m6a.html', 'm6a')">
            <span>m6a</span>
            <span class="tag-badge">數學</span>
          </button>
          <button class="game-btn" onclick="loadGame(this, './m6b.html', 'm6b')">
            <span>m6b</span>
            <span class="tag-badge">數學</span>
          </button>
          <button class="game-btn" onclick="loadGame(this, './m6c.html', 'm6c')">
            <span>m6c</span>
            <span class="tag-badge">數學</span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 遊戲顯示舞台 -->
  <main id="main-area">
    <div id="top-nav">
      <div class="nav-left">
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰ 選單</button>
        <div class="current-game-title" id="display-title">ch7a</div>
      </div>
      <div>
        <a id="btn-fullscreen" class="btn-action" href="./ch7a.html" target="_blank">全螢幕獨立視窗 ↗</a>
      </div>
    </div>

    <div id="iframe-box">
      <iframe id="game-frame" src="./ch7a.html"></iframe>
    </div>
  </main>

  <script>
    // 摺疊選單展開/收合
    function toggleCategory(header) {
      header.parentElement.classList.toggle('open');
    }

    // 切換遊戲
    function loadGame(btn, fileUrl, title) {
      document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('game-frame').src = fileUrl;
      document.getElementById('display-title').textContent = title;
      document.getElementById('btn-fullscreen').href = fileUrl;
    }

    // iPad 側邊欄隱藏/展開
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互動教學整合展示平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --sidebar-bg: #f8fafc;
      --active-bg: #dbeafe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; }
    body { display: flex; height: 100vh; height: 100dvh; background: #f1f5f9; overflow: hidden; color: var(--text-dark); }

    /* 側邊欄 */
    #sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease;
      flex-shrink: 0;
      z-index: 20;
    }
    #sidebar.collapsed {
      margin-left: -300px;
    }
    .brand-box {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .brand-box h1 { font-size: 1.15rem; font-weight: 800; color: #1e3a8a; }
    .brand-box p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    /* 選單容器 */
    #menu-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 單元摺疊區塊 */
    .category-group {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .category-header {
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      user-select: none;
    }
    .category-header:hover { background: #f8fafc; }
    .category-title { display: flex; align-items: center; gap: 8px; }
    .arrow { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s ease; }
    .category-group.open .arrow { transform: rotate(180deg); }

    .category-items {
      display: none;
      padding: 6px 8px 10px 8px;
      flex-direction: column;
      gap: 4px;
      background: #fcfcfd;
      border-top: 1px solid #f1f5f9;
    }
    .category-group.open .category-items { display: flex; }

    /* 遊戲項目按鈕 */
    .game-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .game-btn:hover { background: #f1f5f9; }
    .game-btn.active {
      background: var(--active-bg);
      color: var(--primary);
      border-color: #bfdbfe;
    }

      padding: 2px 8
